<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Staff Inaktivitets Dashboard</title>
</head>
<body class="bg-gray-950 text-gray-100 p-8">

    <h1 class="text-4xl font-bold mb-2 text-center text-white">Staff Status</h1>
    <p class="text-center text-gray-500 mb-8">Inaktivitets-oversigt</p>
    
    <div id="inactivity-list" class="max-w-4xl mx-auto grid gap-4">
        <div class="text-center animate-pulse text-gray-400">Analyserer staff-data...</div>
    </div>

    <script>
        function formatRole(role) {
            const roles = {
                "developer": "Udvikler",
                "support": "Supporter",
                "seniormod": "Senior Mod"
            };
            return roles[role.toLowerCase()] || role.charAt(0).toUpperCase() + role.slice(1);
        }

        function getDanishTimeAgo(dateString) {
            if (!dateString) return "Aldrig set";
            const now = new Date();
            const past = new Date(dateString);
            const diffInSeconds = Math.floor((now - past) / 1000);
            
            const units = [
                { name: "år", seconds: 31536000 },
                { name: "måneder", seconds: 2592000 },
                { name: "dage", seconds: 86400 },
                { name: "timer", seconds: 3600 },
                { name: "minutter", seconds: 60 },
                { name: "sekunder", seconds: 1 }
            ];

            for (let unit of units) {
                const interval = Math.floor(diffInSeconds / unit.seconds);
                if (interval >= 1) return `for ${interval} ${unit.name} siden`;
            }
            return "lige nu";
        }

        async function fetchInactivity() {
            const container = document.getElementById('inactivity-list');
            try {
                const res = await fetch('https://api.superawesome.dk/players/staff');
                const staffList = await res.json();
                
                const detailedStaff = await Promise.all(staffList.map(async (s) => {
                    const detailRes = await fetch(`https://api.superawesome.dk/players/${s.uuid}`);
                    const details = await detailRes.json();
                    return { ...s, lastSeen: details.lastSeen };
                }));

                detailedStaff.sort((a, b) => new Date(a.lastSeen) - new Date(b.lastSeen));

                container.innerHTML = '';
                detailedStaff.forEach(s => {
                    const timeAgo = getDanishTimeAgo(s.lastSeen);
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-gray-900 p-6 rounded-xl border border-gray-800 hover:border-gray-700 transition";
                    div.innerHTML = `
                        <div>
                            <h3 class="text-lg font-bold text-white">${s.username}</h3>
                            <p class="text-xs font-semibold uppercase tracking-widest text-gray-500">${formatRole(s.role)}</p>
                        </div>
                        <span class="font-mono text-red-300 bg-red-950/30 px-4 py-2 rounded-lg text-sm font-medium">
                            ${timeAgo}
                        </span>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = `<p class="text-red-400 text-center">Kunne ikke hente data.</p>`;
            }
        }

        fetchInactivity();
    </script>
</body>
</html>
